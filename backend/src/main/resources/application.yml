server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  application:
    name: mock-dashboard-backend

database:
  jdbc:
    url: ${DATABASE_URL_POOLED:${DATABASE_URL:}}
    schema: ${DATABASE_SCHEMA:public}
    customer-access-table: ${DATABASE_CUSTOMER_ACCESS_TABLE:customer_access}
    local-vin-access-table: ${DATABASE_LOCAL_VIN_ACCESS_TABLE:local_vin_access}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
